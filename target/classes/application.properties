# ============================================================
# Datasource - MySQL (ajustar usuario/clave segun tu Workbench)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_virtual_web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate (Hibernate 5.6, incluido por Spring Boot 2.7.x)
# ============================================================
# La tabla ya la crea el script.sql -> "validate" o "none".
# Si quieres que Hibernate genere/actualice el esquema automaticamente usa "update".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------------------
# FLUSH: modo de sincronizacion manual (se controla tambien
# explicitamente desde el codigo con entityManager.flush())
# ------------------------------------------------------------
spring.jpa.properties.hibernate.flushMode=AUTO

# ------------------------------------------------------------
# BATCHING: agrupa varias sentencias INSERT/UPDATE en lotes
# para mejorar el rendimiento (Tema 2 - 1.2.1)
# ------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ------------------------------------------------------------
# FETCHING: tamaño de lote para inicializar colecciones LAZY
# (Tema 2 - 1.2.1)
# ------------------------------------------------------------
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# ------------------------------------------------------------
# CACHING de 2do nivel (Tema 2 - 1.2.2) - deshabilitado por defecto,
# se deja preparado para activarlo si se desea profundizar el tema.
# ------------------------------------------------------------
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

logging.level.org.hibernate.SQL=DEBUG
